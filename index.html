<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (Android chrome bar + iOS status bar) -->
    <meta name="theme-color" content="#f49b31" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Echo" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />

    <!-- Favicon & PWA icon -->
    <link rel="icon" type="image/svg+xml" href="/echo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- App meta -->
    <meta name="application-name" content="Echo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Echo - Where organizational feedback becomes actionable solutions. Connect, share ideas, and drive positive change."
    />

    <!-- Open Graph Meta Tags for Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Echo - Organizational Feedback Platform"
    />
    <meta
      property="og:description"
      content="Where organizational feedback becomes actionable solutions. Connect, share ideas, and drive positive change."
    />
    <meta property="og:url" content="https://app.echo-ng.com/" />
    <meta property="og:site_name" content="Echo" />
    <meta
      property="og:image"
      content="https://app.echo-ng.com/assets/images/Echo%20Logo.png"
    />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Echo - Organizational Feedback Platform"
    />
    <meta
      name="twitter:description"
      content="Where organizational feedback becomes actionable solutions. Connect, share ideas, and drive positive change."
    />
    <meta
      name="twitter:image"
      content="https://app.echo-ng.com/assets/images/Echo%20Logo.png"
    />

    <title>Echo</title>
  </head>
  <body>
    <style>
      #echo-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out;
      }
      .echo-splash-logo {
        width: 100px;
        height: 100px;
        border-radius: 20px;
        animation: echo-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes echo-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
    </style>
    <div id="echo-splash">
      <img src="/icons/icon-192x192.png" alt="Echo Logo" class="echo-splash-logo" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
